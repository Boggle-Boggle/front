name: Production CI

on:
  pull_request:
    branches:
      - production

permissions:
  contents: read

jobs:
  verify:
    name: Production CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test release version rules
        run: node --test scripts/check-release.test.mjs

      - name: Check service version and release note
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-release.mjs
